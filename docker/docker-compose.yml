# OrderHub — Faz 1 local stack. Çalıştırma: `cd docker && docker compose up -d`
# Ana compose'da published port YOK (K3 — internal). Host erişimi docker-compose.override.yml'de (dev).
# Build context repo kökü (..); Dockerfile servisle co-located.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04 # pinned (latest yasak, K2)
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD} # .env'den; repo'da plaintext yok (K3)
      MSSQL_PID: Developer
    volumes:
      - sql-data:/var/opt/mssql # stateful → volume zorunlu (yoksa veri kaybı)
    healthcheck:
      # Bu image ODBC 17 tools içerir (/opt/mssql-tools, tools18 değil); default encrypt yok → -C gereksiz.
      # $$ = container shell'inde $ olarak genişlesin (compose substitution değil).
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s # SQL Server soğuk start'ı yavaş
    restart: unless-stopped # uzun ömürlü infra
    networks:
      - orderhub

  seq:
    image: datalust/seq:2024.3 # pinned
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq-data:/data
    restart: unless-stopped
    networks:
      - orderhub

  rabbitmq:
    image: rabbitmq:3.13-management # pinned; 3d testleriyle aynı. management plugin → UI (15672, override'da).
    environment:
      # K3: kimlik bilgileri .env'den; repo'da plaintext yok. appsettings RabbitMq:Username/Password env override'ı ile eşleşir.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq # durable queue/mesaj kalıcılığı (broker restart'ta kayıp olmasın)
    healthcheck:
      # Broker GERÇEKTEN hazır mı (process up ≠ ready). Servisler service_healthy bekler → startup yarışı yok (§3.8 normal start).
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s # management plugin dahil soğuk start
    restart: unless-stopped # uzun ömürlü infra
    networks:
      - orderhub

  kafka:
    image: confluentinc/cp-kafka:7.6.1 # pinned; Testcontainers fixture'larıyla AYNI major.minor (test ↔ compose tutarlı). KRaft (Zookeeper-less).
    environment:
      # --- KRaft (Zookeeper YOK): tek node hem broker hem controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- Listener'lar: PLAINTEXT (docker ağı içi), CONTROLLER (KRaft quorum), EXTERNAL (host debug) ---
      # İç servisler kafka:9092'ye bağlanır; host (override port) localhost:9092 → EXTERNAL listener'a forward.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # --- Single-broker dev: replication/ISR 1 (ROADMAP §4.2); rebalance delay 0 → consumer hızlı katılır ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" # dev: producer ilk publish'te order-hub.orders.events topic'i otomatik oluşsun
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Sabit CLUSTER_ID: volume kalıcı → fresh-volume dışında storage tekrar format'lanmaz (metadata tutarlı).
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data # KRaft metadata + log persistence (broker restart'ta offset/log kayıp olmasın)
    healthcheck:
      # Broker GERÇEKTEN hazır mı (process up ≠ API ready, Faz 3 dersi): broker'a bağlanıp topic listeleyebiliyor mu.
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s # KRaft soğuk start (storage format + quorum election) RabbitMQ'dan yavaş → cömert
    restart: unless-stopped # uzun ömürlü infra
    networks:
      - orderhub

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2 # pinned. Opsiyonel gözlem aracı (RabbitMQ management UI eşi).
    environment:
      KAFKA_CLUSTERS_0_NAME: orderhub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy # broker hazır olmadan UI bağlanmaya çalışıp gürültü yapmasın
    # restart/healthcheck YOK: salt gözlem aracı, UI down = stack down değil (altyapı değil).
    networks:
      - orderhub

  orderservice:
    build:
      context: .. # repo kökü
      dockerfile: src/Services/OrderService/OrderService.Api/Dockerfile
    environment:
      # ADR-0001: local dev stack Development'ta çalışır (Swagger + dev token + startup migration).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OrderHub_Order;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      JwtSettings__Secret: ${JWT_SECRET} # .env'den
      # RabbitMq: appsettings'te dev default (Host=localhost, Username=guest); compose env override → broker (K3).
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      # Faz 4 (4b): OrderService domain event'lerini Kafka'ya stream eder (outbox 1:N fan-out). appsettings dev
      # default localhost:9092 → compose'da broker host'una override. Yoksa OrderCreated→Kafka publish başarısız olur.
      Kafka__BootstrapServers: kafka:9092
      # Seq sink yalnızca container'da aktif (appsettings'e dokunmadan inject; index 2 = Console+File'dan sonra).
      Serilog__WriteTo__2__Name: Seq
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
      # ★ 6c-1: distributed tracing → OTLP/HTTP export to Seq (Seq 2024.1+ OTLP ingest). Log ingest (5341) devam eder; traces ayrı OTLP path.
      Otlp__Endpoint: http://seq:5341/ingest/otlp/v1/traces
    depends_on:
      sqlserver:
        condition: service_healthy # şema migration'ı için DB hazır olmalı
      rabbitmq:
        condition: service_healthy # broker hazır olmadan publish/consume bağlanmasın
      kafka:
        condition: service_healthy # outbox processor Kafka'ya publish eder → broker hazır olmalı
      seq:
        condition: service_started
    # restart YOK: startup/migration hatası restart loop'unda gizlenmesin (görünür kalsın).
    networks:
      - orderhub

  paymentservice:
    build:
      context: .. # repo kökü (OrderService ile aynı context)
      dockerfile: src/Services/PaymentService/PaymentService.Api/Dockerfile
    environment:
      # ADR-0001: local dev Development'ta (Swagger + startup migration). Database-per-service → ayrı DB (OrderHub_Payment).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OrderHub_Payment;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      JwtSettings__Secret: ${JWT_SECRET} # .env'den
      # RabbitMq: appsettings dev default'unu override → broker'a bağlanır (K3, secret env'den).
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      # Seq sink yalnızca container'da aktif (index 2 = Console+File'dan sonra).
      Serilog__WriteTo__2__Name: Seq
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
      # ★ 6c-1: distributed tracing → OTLP/HTTP export to Seq (Seq 2024.1+ OTLP ingest). Log ingest (5341) devam eder; traces ayrı OTLP path.
      Otlp__Endpoint: http://seq:5341/ingest/otlp/v1/traces
    depends_on:
      sqlserver:
        condition: service_healthy # şema migration'ı için DB hazır olmalı
      rabbitmq:
        condition: service_healthy # broker hazır olmadan consumer/outbox bağlanmasın
      seq:
        condition: service_started
    # restart YOK: startup/migration hatası restart loop'unda gizlenmesin (OrderService kuralı).
    # PaymentService Kafka'ya PRODUCE ETMEZ (outbox yalnız RabbitMQ event'leri) → Kafka env/depends GEREKMEZ.
    networks:
      - orderhub

  analyticsservice:
    build:
      context: .. # repo kökü (order/payment ile aynı context)
      dockerfile: src/Services/AnalyticsService/AnalyticsService.Api/Dockerfile
    environment:
      # ADR-0001: local dev Development'ta (Swagger + startup migration). Database-per-service → ÜÇÜNCÜ DB (OrderHub_Analytics).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OrderHub_Analytics;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      JwtSettings__Secret: ${JWT_SECRET} # .env'den (K3); read-API JWT doğrular (token üretmez).
      # Kafka consumer (OrderEventsConsumer): appsettings dev default localhost:9092 → compose'da broker host'una override.
      # GroupId appsettings'te (analytics-service.order-events) → override gerekmez.
      Kafka__BootstrapServers: kafka:9092
      # Seq sink yalnızca container'da aktif (appsettings'e dokunmadan inject; index 2 = Console+File'dan sonra).
      Serilog__WriteTo__2__Name: Seq
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
      # ★ 6c-1: distributed tracing → OTLP/HTTP export to Seq (Seq 2024.1+ OTLP ingest). Log ingest (5341) devam eder; traces ayrı OTLP path.
      Otlp__Endpoint: http://seq:5341/ingest/otlp/v1/traces
    depends_on:
      sqlserver:
        condition: service_healthy # OrderHub_Analytics migration'ı için DB hazır olmalı
      kafka:
        condition: service_healthy # consumer bağlanmadan önce broker hazır olmalı
      seq:
        condition: service_started
    # restart YOK: startup/migration hatası görünür kalsın (order/payment kuralı).
    networks:
      - orderhub

  inventoryservice:
    build:
      context: .. # repo kökü (order/payment/analytics ile aynı context)
      dockerfile: src/Services/InventoryService/InventoryService.Api/Dockerfile
    environment:
      # ADR-0001: local dev Development'ta (startup migration). Database-per-service → DÖRDÜNCÜ DB (OrderHub_Inventory).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OrderHub_Inventory;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      # RabbitMq (5c): saga command'lerini (ReserveStock/Confirm/Release) tüketir + sonuç event'lerini publish eder.
      # appsettings dev default localhost → compose'da broker host'una override (K3, secret env'den).
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      # Seq sink yalnızca container'da aktif (appsettings'e dokunmadan inject; index 2 = Console+File'dan sonra).
      Serilog__WriteTo__2__Name: Seq
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
      # ★ 6c-1: distributed tracing → OTLP/HTTP export to Seq (Seq 2024.1+ OTLP ingest). Log ingest (5341) devam eder; traces ayrı OTLP path.
      Otlp__Endpoint: http://seq:5341/ingest/otlp/v1/traces
      # JWT YOK: HTTP endpoint yok (command-driven) → secret gerekmez (K3). Kafka YOK: Inventory Kafka'ya
      # produce/consume etmez (saga RabbitMQ command-style, ADR-0007 Karar 4).
    depends_on:
      sqlserver:
        condition: service_healthy # OrderHub_Inventory migration'ı için DB hazır olmalı
      rabbitmq:
        condition: service_healthy # consumer/publisher broker hazır olmadan bağlanmasın (5c)
      seq:
        condition: service_started
    # restart YOK: startup/migration hatası görünür kalsın (order/payment/analytics kuralı).
    networks:
      - orderhub

  orderprocessingservice:
    build:
      context: .. # repo kökü (diğer servislerle aynı context)
      dockerfile: src/Services/OrderProcessingService/OrderProcessingService.Api/Dockerfile
    environment:
      # ADR-0001: local dev Development'ta (startup migration). Database-per-service → BEŞİNCİ DB (OrderHub_Sagas).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OrderHub_Sagas;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      # RabbitMq (5d): saga, OrderPlaced'ı tüketir + ReserveStock/Confirm/Release/ProcessPayment/ConfirmOrder/
      # MarkOrderPaid/ShipOrder command'lerini yayımlar (ADR-0007 Karar 4). appsettings dev default localhost →
      # compose'da broker host'una override (K3, secret env'den).
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      # Seq sink yalnızca container'da aktif (appsettings'e dokunmadan inject; index 2 = Console+File'dan sonra).
      Serilog__WriteTo__2__Name: Seq
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
      # ★ 6c-1: distributed tracing → OTLP/HTTP export to Seq (Seq 2024.1+ OTLP ingest). Log ingest (5341) devam eder; traces ayrı OTLP path.
      Otlp__Endpoint: http://seq:5341/ingest/otlp/v1/traces
      # JWT YOK: HTTP endpoint yok (saga RabbitMQ ile orkestre eder) → secret gerekmez (K3). Kafka YOK
      # (saga RabbitMQ command-style, ADR-0007 Karar 4). Hangfire YOK (scheduler InventoryService'te).
    depends_on:
      sqlserver:
        condition: service_healthy # OrderHub_Sagas migration'ı için DB hazır olmalı
      rabbitmq:
        condition: service_healthy # saga endpoint broker hazır olmadan bağlanmasın (5d)
      seq:
        condition: service_started
    # restart YOK: startup/migration hatası görünür kalsın (diğer servislerle aynı kural).
    networks:
      - orderhub

  notificationservice:
    build:
      context: .. # repo kökü (diğer servislerle aynı context)
      dockerfile: src/Services/NotificationService/NotificationService.Api/Dockerfile
    environment:
      # ADR-0001: local dev Development'ta (startup migration). Database-per-service → ALTINCI DB (OrderHub_Notifications).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OrderHub_Notifications;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      # Kafka consumer (OrderEventsConsumer): GroupId notification-service.order-events → AnalyticsService'den FARKLI
      # (her iki consumer aynı topic'ten bağımsız okur, tam fan-out). appsettings dev default localhost → container override.
      Kafka__BootstrapServers: kafka:9092
      Kafka__GroupId: notification-service.order-events
      # Seq sink yalnızca container'da aktif (appsettings'e dokunmadan inject; index 2 = Console+File'dan sonra).
      Serilog__WriteTo__2__Name: Seq
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
      # ★ 6c-1: distributed tracing → OTLP/HTTP export to Seq (Seq 2024.1+ OTLP ingest). Log ingest (5341) devam eder; traces ayrı OTLP path.
      Otlp__Endpoint: http://seq:5341/ingest/otlp/v1/traces
      # JWT YOK: HTTP endpoint yok (Kafka consumer-only) → secret gerekmez (K3). RabbitMQ YOK.
    depends_on:
      sqlserver:
        condition: service_healthy # OrderHub_Notifications migration'ı için DB hazır olmalı
      kafka:
        condition: service_healthy # consumer bağlanmadan önce broker hazır olmalı
      seq:
        condition: service_started
    # restart YOK: startup/migration hatası görünür kalsın (diğer servislerle aynı kural).
    networks:
      - orderhub

  gateway:
    build:
      context: .. # repo kökü (diğer servislerle aynı context)
      dockerfile: src/Gateway/OrderHub.Gateway/Dockerfile
    environment:
      # ADR-0001 mirror: dev-token route'unun (OrderService dev-only endpoint) çalışması için Development.
      ASPNETCORE_ENVIRONMENT: Development
      # ★ JWT MERKEZİ: downstream servislerle AYNI secret → OrderService'in ürettiği token gateway'de de geçerli
      # (merkezi erken-401 + downstream defense-in-depth). Secret env'den (K3); Issuer/Audience appsettings'te.
      JwtSettings__Secret: ${JWT_SECRET}
      # ReverseProxy destination'ları appsettings'te compose service adlarıyla default (orderservice:8080 vb) → override YOK.
      # Seq sink yalnızca container'da aktif (index 2 = Console+File'dan sonra).
      Serilog__WriteTo__2__Name: Seq
      Serilog__WriteTo__2__Args__serverUrl: http://seq:5341
      # ★ 6c-1: distributed tracing → OTLP/HTTP export to Seq (Seq 2024.1+ OTLP ingest). Log ingest (5341) devam eder; traces ayrı OTLP path.
      Otlp__Endpoint: http://seq:5341/ingest/otlp/v1/traces
      # Saf edge: DB/RabbitMQ/Kafka YOK (YARP HTTP forward eder).
    depends_on:
      orderservice:
        condition: service_started # route hedefi (YARP bağlanamazsa retry eder → health beklemeye gerek yok)
      paymentservice:
        condition: service_started
      analyticsservice:
        condition: service_started
      # ★ 6a-2 health dashboard: route edilmeyen servisler de /health/ready poll edilir (operasyonel görünürlük).
      # service_started yeterli — HealthChecks.UI poll'ü retry'lı (servis geç hazır olursa panoda kırmızı→yeşil geçer).
      inventoryservice:
        condition: service_started
      orderprocessingservice:
        condition: service_started
      notificationservice:
        condition: service_started
      seq:
        condition: service_started
    # restart YOK: startup hatası (eksik secret / config) görünür kalsın.
    networks:
      - orderhub

networks:
  orderhub:
    driver: bridge

volumes:
  sql-data:
  seq-data:
  rabbitmq-data:
  kafka-data:
